name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same PR supersedes the in-flight run; pushes to other
# refs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck init.sh setup-all.sh scripts/*.sh tests/*.sh
      - name: tests
        run: for t in tests/*.test.sh; do bash "$t"; done
